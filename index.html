<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    
    <!-- Favicon para la pestaña del navegador -->
    <link rel="icon" type="image/png" href="kodacoin.png">

    <!-- Icono oficial para cuando lo agregás al inicio en el iPhone -->
    <link rel="apple-touch-icon" href="kodacoin.png">

    <!-- Configuración para que se abra a pantalla completa como una App nativa -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="KodaCoin">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KodaCoin | Mis Gastos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <meta name="theme-color" content="#89c4f4">
    
    <style>
        :root { 
            --bg-color: #f0f7ff; 
            --card-bg: #ffffff; 
            --primary: #89c4f4; 
            --primary-dark: #63a4d6; 
            --text-main: #334e68; 
            --text-muted: #627d98; 
            --expense: #ff9e9e; 
            --border-radius: 20px; 
        }
        
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 20px 16px; 
            display: flex; 
            justify-content: center; 
            color: var(--text-main); 
        }
        
        .app-container { width: 100%; max-width: 480px; }
        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: none; }
        .summary-card { text-align: center; border: 2px solid var(--primary); }
        .balance-amount { font-size: 32px; font-weight: 800; color: var(--primary-dark); }
        
        /* Selector de pestañas estilo iOS */
        .tab-switcher {
            display: flex;
            background: #e1ecf4;
            border-radius: 16px;
            padding: 4px;
            margin-bottom: 20px;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .tab-btn.active {
            background: #ffffff;
            color: var(--primary-dark);
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        /* Inputs y Selects */
        input, select { width: 100%; padding: 14px; border: 2px solid #e1ecf4; border-radius: 20px; margin-bottom: 12px; box-sizing: border-box; font-family: inherit; font-weight: 600; font-size: 16px; }
        
        button.btn-submit { width: 100%; padding: 14px; background-color: var(--primary); color: white; border: none; border-radius: 20px; font-weight: 700; cursor: pointer; transition: 0.2s; font-family: inherit; }
        button.btn-submit:active { transform: scale(0.98); }
        
        .transaction-item { display: flex; justify-content: space-between; align-items: center; background: #fafbfc; padding: 15px; border-radius: 20px; margin-bottom: 10px; }
        h1, h2, h3 { font-weight: 700; margin-top: 0; }
        canvas { margin-top: 15px; }
        
        .btn-action { background: none; border: none; font-size: 16px; cursor: pointer; padding: 5px 0 5px 10px; transition: 0.2s; }
        .btn-action:active { transform: scale(0.85); }

        .btn-refresh { background: #fafbfc; border: 2px solid #e1ecf4; border-radius: 20px; padding: 0; cursor: pointer; width: 50px; height: 50px; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.2s; box-sizing: border-box; }
        .btn-refresh:active { transform: scale(0.90); }

        /* Barras de porcentaje para categorías y pagadores */
        .category-item { display: flex; flex-direction: column; padding: 12px; background: #fafbfc; border-radius: 16px; margin-bottom: 8px; cursor: pointer; transition: background 0.2s; border: 1px solid #e1ecf4; }
        .category-item:active { background: #e8f3fc; }
        .category-header { display: flex; justify-content: space-between; font-weight: 700; font-size: 14px; margin-bottom: 6px; }
        .category-bar-bg { width: 100%; height: 8px; background-color: #e1ecf4; border-radius: 10px; overflow: hidden; }
        .category-bar-fill { height: 100%; background-color: var(--primary-dark); border-radius: 10px; transition: width 0.3s ease; }

        /* Métricas de la comparativa histórica */
        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 10px;
        }
        .metric-box {
            background: #fafbfc;
            border: 1px solid #e1ecf4;
            padding: 14px;
            border-radius: 16px;
            text-align: center;
        }
        .metric-title { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .metric-value { font-size: 18px; font-weight: 800; color: var(--primary-dark); }

        /* Tabla comparativa histórica */
        .history-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        .history-table th { text-align: left; padding: 10px 8px; color: var(--text-muted); border-bottom: 2px solid #e1ecf4; font-weight: 700; }
        .history-table td { padding: 12px 8px; border-bottom: 1px solid #f0f4f8; }
        .history-table tr:last-child td { border-bottom: none; }
    </style>
</head>
<body>
<div class="app-container">
    
    <div style="text-align: center; margin-top: 10px; margin-bottom: 5px;">
        <img src="kodacoin.png" alt="logo KodaCoin" style="width: 70px; height: auto; border-radius: 50%;">
    </div>
    
    <h1 style="text-align:center; color: var(--primary-dark); margin-top: 5px; margin-bottom: 15px;">KodaCoin 🐾</h1>

    <!-- Pestañas de navegación -->
    <div class="tab-switcher">
        <button class="tab-btn active" id="tab-btn-monthly" onclick="switchTab('monthly')">Gastos del Mes</button>
        <button class="tab-btn" id="tab-btn-history" onclick="switchTab('history')">Comparativa Histórica</button>
    </div>

    <!-- ============================================== -->
    <!-- SECCIÓN 1: VISTA MENSUAL (INICIO HABITUAL)     -->
    <!-- ============================================== -->
    <div id="section-monthly">
        <!-- Filtro y Botón Actualizar -->
        <div class="card" style="display: flex; gap: 10px; align-items: center; padding: 15px 20px;">
            <select id="month-filter" style="margin-bottom: 0; flex: 1;"><option value="all">Ver todo el historial</option></select>
            <button class="btn-refresh" id="btn-refresh" title="Actualizar datos">🔄</button>
        </div>
        
        <div class="card summary-card">
            <div style="font-size: 12px; color:var(--text-muted); text-transform: uppercase;">Total del periodo</div>
            <div class="balance-amount" id="balance-display">$0</div>
        </div>

        <div class="card" id="form-card">
            <h2 id="form-title">Nuevo Gasto</h2>
            <form id="tx-form">
                <input type="date" id="date" required>
                <input type="text" id="desc" placeholder="Concepto" required>
                <select id="category" required>
                    <option value="" disabled selected>Seleccionar categoría</option>
                    <option>Verdulería/Carniceria</option><option>Almuerzo oficina</option><option>Casa</option>
                    <option>Auto</option><option>Super</option><option>Delivery</option><option>Farmacia</option>
                    <option>Gastos varios</option><option>Comer afuera</option><option>Servicios</option>
                    <option>Recreacion</option><option>Regalos</option><option>Tarjeta de Credito</option>
                    <option>Transporte</option><option>Vacaciones</option><option>Suscripciones</option>
                    <option>Gimnasio/Salud</option><option>Panaderia</option><option>Koda</option>
                </select>
                <select id="account" required>
                    <option value="" disabled selected>Seleccionar cuenta</option>
                    <option>Personal Pay</option><option>Tarjeta de Credito</option><option>Debito</option><option>Efectivo</option><option>MercadoPago</option>
                </select>
                <input type="number" id="amount" placeholder="Monto" required>
                <select id="payer" required>
                    <option value="" disabled selected>Quién pagó</option>
                    <option>Fran</option><option>Agus</option><option>Compartido</option>
                </select>
                <button type="submit" class="btn-submit" id="submit-button">Guardar Gasto</button>
            </form>
        </div>

        <!-- Sección Análisis (Gráficos Mensuales) -->
        <div class="card" id="analysis-section" style="display:none">
            <h2>Análisis</h2>
            <canvas id="chart-category"></canvas>
            <canvas id="chart-payer"></canvas>
            <canvas id="chart-method"></canvas>
        </div>

        <!-- Tarjeta Resumen por Categoría -->
        <div class="card" id="category-summary-card" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="margin:0;">Por Categoría</h2>
                <small id="cat-filter-indicator" style="color:var(--primary-dark); font-weight:bold;"></small>
            </div>
            <div id="category-summary-list"></div>
        </div>

        <!-- Tarjeta Resumen por Quién Pagó -->
        <div class="card" id="payer-summary-card" style="display:none;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h2 style="margin:0;">Quién Pagó</h2>
                <small id="payer-filter-indicator" style="color:var(--primary-dark); font-weight:bold;"></small>
            </div>
            <div id="payer-summary-list"></div>
        </div>

        <div class="card">
            <h2>Historial</h2>
            <div id="tx-list">Cargando...</div>
        </div>
    </div>

    <!-- ============================================== -->
    <!-- SECCIÓN 2: COMPARATIVA HISTÓRICA SEPARADA      -->
    <!-- ============================================== -->
    <div id="section-history" style="display: none;">
        <!-- Tarjeta de Métricas Globales -->
        <div class="card">
            <h2>Métricas Globales</h2>
            <div class="metric-grid">
                <div class="metric-box">
                    <div class="metric-title">Promedio / Mes</div>
                    <div class="metric-value" id="hist-avg-display">$0</div>
                </div>
                <div class="metric-box">
                    <div class="metric-title">Mes Récord</div>
                    <div class="metric-value" id="hist-peak-display">-</div>
                </div>
            </div>
            <div class="metric-box" style="margin-top: 8px;">
                <div class="metric-title">Total Acumulado Registrado</div>
                <div class="metric-value" id="hist-total-display">$0</div>
            </div>
        </div>

        <!-- Gráfico Evolución Total Mensual -->
        <div class="card">
            <h2>Evolución del Gasto</h2>
            <canvas id="chart-history-trend"></canvas>
        </div>

        <!-- Gráfico Comparativo de Pagadores a lo largo del tiempo -->
        <div class="card">
            <h2>Distribución por Pagador</h2>
            <canvas id="chart-history-payers"></canvas>
        </div>

        <!-- Tabla Resumen Mes a Mes -->
        <div class="card">
            <h2>Detalle Mes a Mes</h2>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Mes</th>
                        <th style="text-align: right;">Total</th>
                        <th style="text-align: right;">Fran</th>
                        <th style="text-align: right;">Agus</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxF4F9w4HYhOAKaQcLsl2RFKwNvhi3F52x7a3LT9mxaLfhLIOf-1q9DTi-aG8RIvOkVRQ/exec'; 
    let expenses = [], charts = {};
    let editingId = null; 
    let selectedCategoryFilter = null; 
    let selectedPayerFilter = null;
    let currentTab = 'monthly';
    const monthFilter = document.getElementById('month-filter');

    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('date').valueAsDate = new Date();
        loadData();
    });

    // Control de pestañas
    function switchTab(tab) {
        currentTab = tab;
        const btnMonthly = document.getElementById('tab-btn-monthly');
        const btnHistory = document.getElementById('tab-btn-history');
        const secMonthly = document.getElementById('section-monthly');
        const secHistory = document.getElementById('section-history');

        if (tab === 'monthly') {
            btnMonthly.classList.add('active');
            btnHistory.classList.remove('active');
            secMonthly.style.display = 'block';
            secHistory.style.display = 'none';
        } else {
            btnHistory.classList.add('active');
            btnMonthly.classList.remove('active');
            secMonthly.style.display = 'none';
            secHistory.style.display = 'block';
            renderHistoricalComparison();
        }
    }

    document.getElementById('btn-refresh').addEventListener('click', loadData);
    monthFilter.addEventListener('change', () => {
        selectedCategoryFilter = null; 
        selectedPayerFilter = null;
        updateUI();
    });

    function loadData() {
        const list = document.getElementById('tx-list');
        list.innerHTML = '<p style="text-align:center; color:var(--text-muted);">Cargando datos...</p>';
        
        fetch(scriptURL).then(res => res.json()).then(data => {
            expenses = data;
            
            const currentSelected = monthFilter.value;
            monthFilter.innerHTML = '<option value="all">Ver todo el historial</option>';
            const months = [...new Set(expenses.map(tx => tx.date.substring(0, 7)))].sort().reverse();
            months.forEach(m => { 
                const opt = document.createElement('option'); 
                opt.value = m; 
                opt.text = m; 
                monthFilter.appendChild(opt); 
            });
            
            if (months.includes(currentSelected)) {
                monthFilter.value = currentSelected;
            } else {
                const currentMonth = new Date().toISOString().substring(0, 7);
                if (months.includes(currentMonth)) {
                    monthFilter.value = currentMonth;
                }
            }
            
            updateUI();
            if (currentTab === 'history') {
                renderHistoricalComparison();
            }
        }).catch(err => {
            list.innerHTML = '<p style="text-align:center; color:var(--expense); font-weight:700;">Error al conectar con Google Sheets.</p>';
            console.error(err);
        });
    }

    document.getElementById('tx-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const date = document.getElementById('date').value;
        const desc = document.getElementById('desc').value;
        const category = document.getElementById('category').value;
        const account = document.getElementById('account').value;
        const amount = document.getElementById('amount').value;
        const payer = document.getElementById('payer').value;

        if (editingId) {
            expenses = expenses.map(tx => tx.id.toString() === editingId.toString() ? { id: editingId, date, desc, category, account, amount, payer } : tx);
            updateUI();
            
            fetch(scriptURL, { 
                method: 'POST', 
                body: JSON.stringify({ action: 'edit', id: editingId, date, desc, category, account, amount, payer }) 
            });
            
            editingId = null;
            document.getElementById('form-title').innerText = "Nuevo Gasto";
            document.getElementById('submit-button').innerText = "Guardar Gasto";
        } else {
            const localId = Date.now().toString();
            const tx = { id: localId, date, desc, category, account, amount, payer };
            
            expenses.push(tx); 
            updateUI();
            fetch(scriptURL, { method: 'POST', body: JSON.stringify(tx) });
        }
        
        this.reset(); 
        document.getElementById('date').valueAsDate = new Date();
    });

    function editExpense(id) {
        const tx = expenses.find(e => e.id.toString() === id.toString());
        if (tx) {
            editingId = id;
            document.getElementById('date').value = tx.date.split('T')[0];
            document.getElementById('desc').value = tx.desc;
            document.getElementById('category').value = tx.category;
            document.getElementById('account').value = tx.account;
            document.getElementById('amount').value = tx.amount;
            document.getElementById('payer').value = tx.payer;
            document.getElementById('form-title').innerText = "Editar Gasto ✏️";
            document.getElementById('submit-button').innerText = "Actualizar Gasto";
            document.getElementById('form-card').scrollIntoView({ behavior: 'smooth' });
        }
    }

    function deleteExpense(id) {
        if (confirm('¿Seguro que querés borrar este gasto?')) {
            expenses = expenses.filter(tx => tx.id.toString() !== id.toString());
            updateUI();
            fetch(scriptURL, { method: 'POST', body: JSON.stringify({ action: 'delete', id: id }) });
            if(editingId && editingId.toString() === id.toString()) {
                editingId = null;
                document.getElementById('tx-form').reset();
                document.getElementById('date').valueAsDate = new Date();
                document.getElementById('form-title').innerText = "Nuevo Gasto";
                document.getElementById('submit-button').innerText = "Guardar Gasto";
            }
        }
    }

    // Actualiza la UI de la pestaña mensual
    function updateUI() {
        const list = document.getElementById('tx-list'), selected = monthFilter.value;
        list.innerHTML = '';
        let total = 0, byCat = {}, byPayer = {}, byMet = {};
        
        const filteredByMonth = expenses.filter(tx => selected === 'all' || tx.date.substring(0, 7) === selected);
        
        if (filteredByMonth.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--text-muted);">No hay gastos en este periodo.</p>';
            document.getElementById('analysis-section').style.display = 'none';
            document.getElementById('category-summary-card').style.display = 'none';
            document.getElementById('payer-summary-card').style.display = 'none';
        } else {
            document.getElementById('analysis-section').style.display = 'block';
            document.getElementById('category-summary-card').style.display = 'block';
            document.getElementById('payer-summary-card').style.display = 'block';
        }

        filteredByMonth.forEach(tx => {
            const amt = parseFloat(tx.amount);
            total += amt;
            byCat[tx.category] = (byCat[tx.category] || 0) + amt;
            byPayer[tx.payer] = (byPayer[tx.payer] || 0) + amt;
            byMet[tx.account] = (byMet[tx.account] || 0) + amt;
        });

        document.getElementById('balance-display').innerText = `$${Math.round(total).toLocaleString()}`;

        // 1. Resumen por Categoría
        const catSummaryContainer = document.getElementById('category-summary-list');
        catSummaryContainer.innerHTML = '';
        const sortedCategories = Object.entries(byCat).sort((a, b) => b[1] - a[1]);

        sortedCategories.forEach(([catName, catTotal]) => {
            const percentage = total > 0 ? ((catTotal / total) * 100).toFixed(1) : 0;
            const isSelected = selectedCategoryFilter === catName;
            
            const catRow = document.createElement('div');
            catRow.className = 'category-item';
            if (isSelected) catRow.style.border = '2px solid var(--primary-dark)';
            
            catRow.innerHTML = `
                <div class="category-header">
                    <span>${catName} <small style="color:var(--text-muted); font-weight:normal;">(${percentage}%)</small></span>
                    <span style="color:var(--text-main);">$${Math.round(catTotal).toLocaleString()}</span>
                </div>
                <div class="category-bar-bg">
                    <div class="category-bar-fill" style="width: ${percentage}%;"></div>
                </div>
            `;

            catRow.onclick = () => {
                selectedCategoryFilter = (selectedCategoryFilter === catName) ? null : catName;
                updateUI();
            };

            catSummaryContainer.appendChild(catRow);
        });

        // 2. Resumen por Quién Pagó
        const payerSummaryContainer = document.getElementById('payer-summary-list');
        payerSummaryContainer.innerHTML = '';
        const sortedPayers = Object.entries(byPayer).sort((a, b) => b[1] - a[1]);

        sortedPayers.forEach(([payerName, payerTotal]) => {
            const percentage = total > 0 ? ((payerTotal / total) * 100).toFixed(1) : 0;
            const isSelected = selectedPayerFilter === payerName;
            
            const payerRow = document.createElement('div');
            payerRow.className = 'category-item';
            if (isSelected) payerRow.style.border = '2px solid var(--primary-dark)';
            
            payerRow.innerHTML = `
                <div class="category-header">
                    <span>${payerName} <small style="color:var(--text-muted); font-weight:normal;">(${percentage}%)</small></span>
                    <span style="color:var(--text-main);">$${Math.round(payerTotal).toLocaleString()}</span>
                </div>
                <div class="category-bar-bg">
                    <div class="category-bar-fill" style="width: ${percentage}%;"></div>
                </div>
            `;

            payerRow.onclick = () => {
                selectedPayerFilter = (selectedPayerFilter === payerName) ? null : payerName;
                updateUI();
            };

            payerSummaryContainer.appendChild(payerRow);
        });

        // Indicadores visuales de filtros
        const catIndicator = document.getElementById('cat-filter-indicator');
        if (selectedCategoryFilter) {
            catIndicator.innerText = `Filtrado: ${selectedCategoryFilter} ✖`;
            catIndicator.style.cursor = 'pointer';
            catIndicator.onclick = () => { selectedCategoryFilter = null; updateUI(); };
        } else {
            catIndicator.innerText = '';
        }

        const payerIndicator = document.getElementById('payer-filter-indicator');
        if (selectedPayerFilter) {
            payerIndicator.innerText = `Filtrado: ${selectedPayerFilter} ✖`;
            payerIndicator.style.cursor = 'pointer';
            payerIndicator.onclick = () => { selectedPayerFilter = null; updateUI(); };
        } else {
            payerIndicator.innerText = '';
        }

        // 3. Filtrar y renderizar transacciones
        let finalFiltered = filteredByMonth;
        if (selectedCategoryFilter) finalFiltered = finalFiltered.filter(tx => tx.category === selectedCategoryFilter);
        if (selectedPayerFilter) finalFiltered = finalFiltered.filter(tx => tx.payer === selectedPayerFilter);

        if (finalFiltered.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:var(--text-muted);">No hay gastos con los filtros aplicados.</p>';
        } else {
            finalFiltered.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(tx => {
                const shortDate = tx.date.split('T')[0];
                list.innerHTML += `
                    <div class="transaction-item">
                        <div>
                            <b>${tx.desc}</b><br>
                            <small style="color:var(--text-muted)">${shortDate} • ${tx.category} • ${tx.payer} • ${tx.account}</small>
                        </div>
                        <div style="display: flex; align-items: center;">
                            <div style="color:var(--expense); font-weight:700; white-space: nowrap;">
                                -$${Math.round(parseFloat(tx.amount)).toLocaleString()}
                            </div>
                            <button class="btn-action" style="color: var(--primary-dark);" onclick="editExpense('${tx.id}')">✏️</button>
                            <button class="btn-action" style="color: var(--expense);" onclick="deleteExpense('${tx.id}')">❌</button>
                        </div>
                    </div>`;
            });
        }

        // 4. Gráficos circulares mensuales
        if(filteredByMonth.length > 0) {
            createChart('chart-category', 'Gastos por Categoría', byCat);
            createChart('chart-payer', 'Gastos por Persona', byPayer);
            createChart('chart-method', 'Gastos por Cuenta', byMet);
        }
    }

    // Renderiza la sección de Comparativa Histórica
    function renderHistoricalComparison() {
        if (!expenses || expenses.length === 0) return;

        // Agrupación mensual
        const monthlyData = {};
        expenses.forEach(tx => {
            const m = tx.date.substring(0, 7);
            const amt = parseFloat(tx.amount) || 0;
            if (!monthlyData[m]) {
                monthlyData[m] = { total: 0, fran: 0, agus: 0, compartido: 0 };
            }
            monthlyData[m].total += amt;
            const p = (tx.payer || '').toLowerCase();
            if (p.includes('fran')) monthlyData[m].fran += amt;
            else if (p.includes('agus')) monthlyData[m].agus += amt;
            else monthlyData[m].compartido += amt;
        });

        // Orden cronológico (más antiguo al más nuevo para gráficos)
        const sortedMonths = Object.keys(monthlyData).sort();
        const totals = sortedMonths.map(m => Math.round(monthlyData[m].total));
        const franTotals = sortedMonths.map(m => Math.round(monthlyData[m].fran));
        const agusTotals = sortedMonths.map(m => Math.round(monthlyData[m].agus));
        const sharedTotals = sortedMonths.map(m => Math.round(monthlyData[m].compartido));

        // Métricas
        const grandTotal = totals.reduce((acc, curr) => acc + curr, 0);
        const avgMonthly = Math.round(grandTotal / (sortedMonths.length || 1));
        
        let maxMonth = '-', maxVal = 0;
        sortedMonths.forEach(m => {
            if (monthlyData[m].total > maxVal) {
                maxVal = monthlyData[m].total;
                maxMonth = m;
            }
        });

        document.getElementById('hist-total-display').innerText = `$${grandTotal.toLocaleString()}`;
        document.getElementById('hist-avg-display').innerText = `$${avgMonthly.toLocaleString()}`;
        document.getElementById('hist-peak-display').innerText = `${maxMonth} ($${Math.round(maxVal).toLocaleString()})`;

        // 1. Gráfico de Barras: Evolución del gasto total
        if (charts['chart-history-trend']) charts['chart-history-trend'].destroy();
        charts['chart-history-trend'] = new Chart(document.getElementById('chart-history-trend'), {
            type: 'bar',
            data: {
                labels: sortedMonths,
                datasets: [{
                    label: 'Total Gastado',
                    data: totals,
                    backgroundColor: '#89c4f4',
                    borderRadius: 8
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => ` Total: $${ctx.raw.toLocaleString()}`
                        }
                    }
                },
                scales: {
                    y: {
                        ticks: {
                            callback: (v) => `$${(v / 1000000).toFixed(1)}M`
                        }
                    }
                }
            }
        });

        // 2. Gráfico de Barras Apiladas: Distribución por Pagador
        if (charts['chart-history-payers']) charts['chart-history-payers'].destroy();
        charts['chart-history-payers'] = new Chart(document.getElementById('chart-history-payers'), {
            type: 'bar',
            data: {
                labels: sortedMonths,
                datasets: [
                    { label: 'Fran', data: franTotals, backgroundColor: '#63a4d6', borderRadius: 6 },
                    { label: 'Agus', data: agusTotals, backgroundColor: '#ff9e9e', borderRadius: 6 },
                    { label: 'Compartido', data: sharedTotals, backgroundColor: '#a3e4d7', borderRadius: 6 }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: { stacked: true },
                    y: { 
                        stacked: true,
                        ticks: { callback: (v) => `$${(v / 1000000).toFixed(1)}M` }
                    }
                },
                plugins: {
                    tooltip: {
                        callbacks: {
                            label: (ctx) => ` ${ctx.dataset.label}: $${ctx.raw.toLocaleString()}`
                        }
                    }
                }
            }
        });

        // 3. Llenar tabla mes a mes (orden inverso: más reciente primero)
        const tableBody = document.getElementById('history-table-body');
        tableBody.innerHTML = '';
        [...sortedMonths].reverse().forEach(m => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td style="font-weight:700;">${m}</td>
                <td style="text-align:right; font-weight:700; color:var(--text-main);">$${Math.round(monthlyData[m].total).toLocaleString()}</td>
                <td style="text-align:right; color:var(--text-muted);">$${Math.round(monthlyData[m].fran).toLocaleString()}</td>
                <td style="text-align:right; color:var(--text-muted);">$${Math.round(monthlyData[m].agus).toLocaleString()}</td>
            `;
            tableBody.appendChild(row);
        });
    }

    function createChart(id, label, data) {
        if(charts[id]) charts[id].destroy();
        
        const colores = [
            '#89c4f4', '#ff9e9e', '#a3e4d7', '#f7dc6f', '#d2b4de', 
            '#f1948a', '#73c6b6', '#f8c471', '#bb8fce', '#58d68d', 
            '#85c1e9', '#f0b27a', '#aeb6bf', '#f5b041', '#48c9b0', 
            '#af7ac5', '#5dade2', '#ec7063', '#f4d03f', '#a9dfbf'
        ];

        const roundedValues = Object.values(data).map(val => Math.round(val));

        charts[id] = new Chart(document.getElementById(id), {
            type: 'pie',
            data: { 
                labels: Object.keys(data), 
                datasets: [{ 
                    data: roundedValues, 
                    backgroundColor: colores,
                    borderWidth: 2, 
                    borderColor: '#ffffff'
                }] 
            },
            options: { 
                plugins: { 
                    title: { display: true, text: label, font: { family: 'system-ui', size: 16 } },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return ` ${context.label}: $${context.raw.toLocaleString()}`;
                            }
                        }
                    }
                } 
            }
        });
    }
</script>
</body>
</html>
